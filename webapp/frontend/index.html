<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Traductor inga - español con un agente que lee una wiki citada y muestra cómo llegó a cada traducción." />
    <meta name="theme-color" content="#0b1712" />
    <title>Inga Wiki - traductor inga y español</title>
    <script>
      // Tema antes del primer pintado para evitar el parpadeo.
      (function () {
        try {
          var t = localStorage.getItem('inga.tema');
          if (t !== 'dark' && t !== 'light') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
