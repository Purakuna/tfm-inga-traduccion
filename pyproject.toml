[project]
name = "tfm-inga-traduccion"
version = "0.2.0"
description = "TFM UNIR: sistema comparativo de traduccion automatica Inga-espanol mediante fine-tuning de modelos multilingues y RAG sobre modelos de lenguaje de frontera"
requires-python = ">=3.11,<3.13"
authors = [
    { name = "William Santos" },
    { name = "Daniel Eslava" },
]
license = { text = "MIT" }
dependencies = [
    "accelerate>=1.13.0",
    "anthropic>=0.102.0",
    "bert-score>=0.3.13",
    "datasets>=4.8.5",
    "fastapi>=0.141.1",
    "google-genai>=2.4.0",
    "httpx>=0.28.1",
    "lancedb>=0.30.2",
    "matplotlib>=3.10.9",
    "nbformat>=5.10.4",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "peft>=0.19.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "sacrebleu>=2.6.0",
    "scikit-learn>=1.8.0",
    "sentence-transformers>=5.5.0",
    "sentencepiece>=0.2.1",
    "sse-starlette>=3.4.11",
    "tqdm>=4.67.3",
    "transformers>=5.8.1",
    "uvicorn[standard]>=0.53.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "pytest>=9.0.3",
]
